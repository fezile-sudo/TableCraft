<nav class="main-navbar">

  <div class="container">

    <a
      class="restaurant-brand"
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <span class="brand-name">TABLECRAFT</span>

      <span class="brand-tagline">
        Modern African Dining
      </span>

    </a>

    <button
      type="button"
      class="navbar-toggler"
      (click)="toggleNav()"
      [attr.aria-expanded]="isNavOpen"
      aria-controls="main-navigation"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon">
        <span></span>
        <span></span>
        <span></span>
      </span>

    </button>

    <div
      id="main-navigation"
      class="main-navbar-collapse"
      [class.is-open]="isNavOpen">

      <nav class="main-nav">

        <a
          routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeNav()">
          Home
        </a>

        <a
          routerLink="/about"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeNav()">
          Our Story
        </a>

        <a
          routerLink="/menu"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeNav()">
          Menu
        </a>

        <a
          routerLink="/contact"
          routerLinkActive="active"
          class="nav-link"
          (click)="closeNav()">
          Contact
        </a>

      </nav>

    </div>

  </div>

</nav>
